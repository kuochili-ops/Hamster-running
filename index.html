<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🐹 倉鼠滾球大賽 | Hamster Ball Derby 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #1a1f2c;
      font-family: 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    #canvas-container {
      position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1;
    }

    /* 頂部極簡轉播 HUD (高度約 44px) */
    #top-hud {
      position: fixed; top: 10px; left: 12px; right: 12px; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      pointer-events: none;
    }
    .hud-pill {
      pointer-events: auto;
      background: rgba(18, 22, 33, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 6px 14px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      font-size: 13px;
    }

    /* 迷你 6px 賽道進度條 */
    #mini-track {
      position: relative; width: 150px; height: 6px;
      background: rgba(255,255,255,0.2); border-radius: 999px;
    }
    .track-dot {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 11px; height: 11px; border-radius: 50%;
      border: 1.5px solid #fff; transition: left 0.08s linear;
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
    }

    /* 賽況即時跑馬燈 */
    #ticker-box {
      flex: 1; max-width: 480px; overflow: hidden; white-space: nowrap;
      justify-content: center; font-weight: 600; color: #ffe58f;
    }
    #ticker-text {
      display: inline-block;
      animation: pulseText 0.35s ease;
    }
    @keyframes pulseText {
      0% { transform: scale(0.95); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 視角切換與音效按鈕 */
    .cam-btn {
      background: rgba(255,255,255,0.1); border: none; color: #ddd;
      padding: 4px 9px; border-radius: 999px; font-size: 12px; cursor: pointer;
      transition: all 0.2s; font-weight: 600;
    }
    .cam-btn.active, .cam-btn:hover {
      background: #ff9f1c; color: #111;
    }

    /* 賽前押注與起跑面板 (開跑後自動往下滑出) */
    #bet-panel {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 12; width: min(94vw, 680px);
      background: rgba(18, 22, 33, 0.84);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px; padding: 14px 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }
    #bet-panel.hidden {
      transform: translate(-50%, 140%);
      opacity: 0; pointer-events: none;
    }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; font-size: 14px; font-weight: 700; color: #ffd166;
    }
    .hamster-cards {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
      margin-bottom: 12px;
    }
    .h-card {
      background: rgba(255,255,255,0.08); border: 2px solid transparent;
      border-radius: 12px; padding: 8px 4px; text-align: center;
      cursor: pointer; transition: all 0.2s;
    }
    .h-card:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
    .h-card.selected {
      border-color: #ffd166; background: rgba(255, 209, 102, 0.2);
      box-shadow: 0 0 12px rgba(255, 209, 102, 0.4);
    }
    .h-swatch {
      width: 24px; height: 24px; border-radius: 50%; margin: 0 auto 4px;
      border: 2px solid #fff;
    }
    .h-name { font-size: 12px; font-weight: 700; }
    .h-trait { font-size: 10px; color: #bbb; margin-top: 2px; }

    #start-btn {
      width: 100%; padding: 11px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #ff595e, #ff9f1c);
      color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 1px;
      cursor: pointer; box-shadow: 0 4px 15px rgba(255, 89, 94, 0.45);
      transition: transform 0.15s;
    }
    #start-btn:hover { transform: scale(1.015); }
    #start-btn:active { transform: scale(0.98); }

    /* 頒獎台結算浮層 */
    #podium-overlay {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      z-index: 15; width: min(92vw, 480px);
      background: rgba(18, 22, 33, 0.86);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 20px; padding: 16px 20px; text-align: center;
      display: none; box-shadow: 0 12px 35px rgba(0,0,0,0.55);
    }
    #podium-overlay h2 { font-size: 19px; color: #ffd166; margin-bottom: 6px; }
    #bet-result { font-size: 14px; margin-bottom: 10px; font-weight: 700; }
    #podium-list {
      display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; font-size: 13px;
    }
    .podium-badge {
      background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 10px;
    }
    #restart-btn {
      padding: 9px 24px; border: none; border-radius: 999px;
      background: #06d6a0; color: #0b251c; font-weight: 800; font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      #mini-track { width: 90px; }
      #ticker-box { font-size: 12px; padding: 6px 10px; }
      .cam-btn { padding: 4px 7px; font-size: 11px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 頂部極簡轉播 HUD -->
  <div id="top-hud">
    <div class="hud-pill" title="賽道即時進度">
      <span>🏁</span>
      <div id="mini-track"></div>
    </div>

    <div class="hud-pill" id="ticker-box">
      <span id="ticker-text">🎙️ 五隻巨無霸倉鼠球已在起跑線排滿賽道，請押注冠軍並開跑！</span>
    </div>

    <div class="hud-pill">
      <button class="cam-btn active" data-cam="broadcast">🎥 轉播</button>
      <button class="cam-btn" data-cam="hero">🐹 押注</button>
      <button class="cam-btn" data-cam="aerial">🦅 鳥瞰</button>
      <button class="cam-btn" id="mute-btn" title="音效開關">🔊</button>
    </div>
  </div>

  <!-- 賽前押注面板 -->
  <div id="bet-panel">
    <div class="panel-header">
      <span>🏆 倉鼠滾球大賽 — 預測誰最先衝過終點！</span>
      <span id="selected-label">已押注：1號 焦糖布丁</span>
    </div>
    <div class="hamster-cards" id="hamster-cards"></div>
    <button id="start-btn">✂️ START 剪綵開跑！</button>
  </div>

  <!-- 頒獎台結算面板 -->
  <div id="podium-overlay">
    <h2>🎉 比賽結束！前三名榮耀登台 🎉</h2>
    <div id="bet-result"></div>
    <div id="podium-list"></div>
    <button id="restart-btn">🔄 再比一場</button>
  </div>

  <script>
    // ================= 1. Web Audio 合成音效引擎 =================
    const SoundFX = (() => {
      let ctx = null;
      let muted = false;

      function ensureCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
      }

      function playTone(freq, type, duration, vol = 0.15, slideFreq = null) {
        if (muted) return;
        ensureCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, now + duration);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      return {
        toggleMute() {
          muted = !muted;
          return muted;
        },
        startHorn() {
          playTone(523.25, 'triangle', 0.14, 0.2);
          setTimeout(() => playTone(659.25, 'triangle', 0.14, 0.2), 120);
          setTimeout(() => playTone(783.99, 'triangle', 0.35, 0.25), 240);
        },
        bump() {
          playTone(150, 'sine', 0.18, 0.24, 55);
        },
        dizzy() {
          playTone(720, 'sine', 0.22, 0.12, 340);
        },
        nibble() {
          playTone(920, 'square', 0.05, 0.06, 1200);
        },
        fanfare() {
          const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
          notes.forEach((n, i) => {
            setTimeout(() => playTone(n, 'triangle', i === notes.length - 1 ? 0.5 : 0.15, 0.22), i * 130);
          });
        }
      };
    })();

    // ================= 2. 選手設定資料 =================
    const HAMSTER_CONFIGS = [
      { id: 0, num: '1號', name: '焦糖布丁', trait: '暴衝型', bodyColor: 0xe69c4c, bellyColor: 0xfff5e4, patchColor: 0xc97424, ballTint: 0xffd166, uiColor: '#f4a261' },
      { id: 1, num: '2號', name: '雪球麻糬', trait: '迷航型', bodyColor: 0xf7f7f7, bellyColor: 0xffffff, patchColor: 0xd9d9d9, ballTint: 0xa8dadc, uiColor: '#a8dadc' },
      { id: 2, num: '3號', name: '黑糖珍珠', trait: '路障王', bodyColor: 0x4a3b32, bellyColor: 0xdccbb8, patchColor: 0x2b211b, ballTint: 0xffadad, uiColor: '#c98a63' },
      { id: 3, num: '4號', name: '三花豆皮', trait: '貪吃鬼', bodyColor: 0xd98a3c, bellyColor: 0xffffff, patchColor: 0x3b2f2f, ballTint: 0xbde0fe, uiColor: '#e76f51' },
      { id: 4, num: '5號', name: '芝麻湯圓', trait: '干擾王', bodyColor: 0x7c828d, bellyColor: 0xf0f2f5, patchColor: 0x4d5259, ballTint: 0xcaffbf, uiColor: '#90be6d' }
    ];

    // ================= 3. Three.js 場景與賽道建構 =================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202738);
    scene.fog = new THREE.Fog(0x202738, 38, 125);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 220);
    camera.position.set(0, 8.2, -15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 燈光系統
    const hemiLight = new THREE.HemisphereLight(0xfff8e7, 0x3a445c, 0.85);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
    dirLight.position.set(16, 30, 22);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 2;
    dirLight.shadow.camera.far = 120;
    const d = 52;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // 賽道與放大球體尺寸參數
    // 球半徑 1.22 -> 單球直徑 2.44 -> 五球並排總寬 12.20，幾乎填滿 13.0 賽道寬度！
    const TRACK_WIDTH = 13.0;
    const TRACK_LENGTH = 76.0;
    const START_Z = 0;
    const FINISH_Z = 62.0;
    const BALL_RADIUS = 1.22;
    const HAMSTER_SCALE = 1.48;
    const LANE_SPACING = 2.52;

    function getLaneX(idx) {
      return (idx - 2) * LANE_SPACING;
    }

    // 木紋地板材質
    function createWoodTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#d4a373';
      g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 8; i++) {
        g.fillStyle = i % 2 === 0 ? 'rgba(188,138,95,0.35)' : 'rgba(230,184,138,0.25)';
        g.fillRect(i * 64, 0, 62, 512);
        g.fillStyle = 'rgba(110,71,38,0.35)';
        g.fillRect(i * 64 + 62, 0, 2, 512);
      }
      g.fillStyle = 'rgba(255,255,255,0.45)';
      for (let i = 1; i < 5; i++) {
        const x = (512 / 5) * i;
        for (let y = 10; y < 512; y += 48) {
          g.fillRect(x - 2, y, 4, 24);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 6);
      return tex;
    }

    const trackFloor = new THREE.Mesh(
      new THREE.BoxGeometry(TRACK_WIDTH, 0.6, TRACK_LENGTH + 22),
      new THREE.MeshStandardMaterial({ map: createWoodTexture(), roughness: 0.65 })
    );
    trackFloor.position.set(0, -0.3, TRACK_LENGTH / 2);
    trackFloor.receiveShadow = true;
    scene.add(trackFloor);

    // 兩側護欄與觀眾席
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.4 });
    const railStripeMat = new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.4 });
    [-1, 1].forEach(side => {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.5, TRACK_LENGTH + 22), wallMat);
      wall.position.set(side * (TRACK_WIDTH / 2 + 0.3), 0.75, TRACK_LENGTH / 2);
      wall.castShadow = true;
      wall.receiveShadow = true;
      scene.add(wall);

      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.28, TRACK_LENGTH + 22), railStripeMat);
      stripe.position.set(side * (TRACK_WIDTH / 2 + 0.3), 1.32, TRACK_LENGTH / 2);
      scene.add(stripe);

      const stand = new THREE.Mesh(
        new THREE.BoxGeometry(4.5, 2.4, TRACK_LENGTH + 18),
        new THREE.MeshStandardMaterial({ color: 0x2b3448, roughness: 0.8 })
      );
      stand.position.set(side * (TRACK_WIDTH / 2 + 3.2), 1.2, TRACK_LENGTH / 2);
      scene.add(stand);

      const spectatorColors = [0xff595e, 0xffca3a, 0x8ac926, 0x1982c4, 0x6a4c93, 0xff9f1c];
      for (let z = -2; z <= FINISH_Z + 10; z += 2.6) {
        const fan = new THREE.Mesh(
          new THREE.SphereGeometry(0.42, 10, 10),
          new THREE.MeshStandardMaterial({ color: spectatorColors[Math.floor(Math.abs(z * 7)) % spectatorColors.length] })
        );
        fan.position.set(
          side * (TRACK_WIDTH / 2 + 1.8 + (Math.abs(Math.sin(z)) * 1.6)),
          2.7 + (Math.abs(Math.cos(z)) * 0.4),
          z
        );
        fan.userData.baseY = fan.position.y;
        fan.userData.phase = z * 0.7;
        scene.add(fan);
        if (!scene.userData.fans) scene.userData.fans = [];
        scene.userData.fans.push(fan);
      }
    });

    // 起跑線與紅絲帶系統 (配合大球半徑往前方調整位置)
    const startLine = new THREE.Mesh(
      new THREE.PlaneGeometry(TRACK_WIDTH, 0.5),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    startLine.rotation.x = -Math.PI / 2;
    startLine.position.set(0, 0.01, START_Z);
    scene.add(startLine);

    const RIBBON_Z = START_Z + BALL_RADIUS + 0.35;
    const ribbonGroup = new THREE.Group();
    scene.add(ribbonGroup);
    [-1, 1].forEach(side => {
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.18, 2.2, 12),
        new THREE.MeshStandardMaterial({ color: 0xffd166, metalness: 0.6, roughness: 0.3 })
      );
      post.position.set(side * (TRACK_WIDTH / 2 - 0.1), 1.1, RIBBON_Z);
      post.castShadow = true;
      scene.add(post);
    });

    const RIBBON_SEGS = 28;
    const ribbonGeo = new THREE.BoxGeometry(TRACK_WIDTH, 0.2, 0.05, RIBBON_SEGS, 1, 1);
    const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.35, side: THREE.DoubleSide });
    const ribbonMesh = new THREE.Mesh(ribbonGeo, ribbonMat);
    ribbonMesh.position.set(0, 1.25, RIBBON_Z);
    ribbonMesh.castShadow = true;
    ribbonGroup.add(ribbonMesh);
    const ribbonOrigPos = ribbonGeo.attributes.position.array.slice();

    // 終點黑白格線與拱門
    function createCheckeredTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 64;
      const g = c.getContext('2d');
      const sz = 16;
      for (let y = 0; y < 64; y += sz) {
        for (let x = 0; x < 256; x += sz) {
          g.fillStyle = ((x / sz + y / sz) % 2 === 0) ? '#ffffff' : '#111111';
          g.fillRect(x, y, sz, sz);
        }
      }
      return new THREE.CanvasTexture(c);
    }
    const finishLine = new THREE.Mesh(
      new THREE.PlaneGeometry(TRACK_WIDTH, 1.8),
      new THREE.MeshBasicMaterial({ map: createCheckeredTexture() })
    );
    finishLine.rotation.x = -Math.PI / 2;
    finishLine.position.set(0, 0.015, FINISH_Z);
    scene.add(finishLine);

    const archMat = new THREE.MeshStandardMaterial({ color: 0xff9f1c, roughness: 0.3 });
    [-1, 1].forEach(side => {
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 5.2, 16), archMat);
      pillar.position.set(side * (TRACK_WIDTH / 2 + 0.1), 2.6, FINISH_Z);
      scene.add(pillar);
    });
    const archTop = new THREE.Mesh(new THREE.BoxGeometry(TRACK_WIDTH + 1.1, 0.95, 0.55), archMat);
    archTop.position.set(0, 5.1, FINISH_Z);
    scene.add(archTop);

    // 賽道木頭減速彈跳條
    const bumps = [];
    const bumpMat = new THREE.MeshStandardMaterial({ color: 0x8d5524, roughness: 0.7 });
    [
      { x: -2.8, z: 16, w: 3.6 },
      { x: 2.6, z: 27, w: 4.0 },
      { x: 0.0, z: 39, w: 4.2 },
      { x: -2.2, z: 50, w: 3.8 }
    ].forEach(b => {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, b.w, 12), bumpMat);
      mesh.rotation.z = Math.PI / 2;
      mesh.position.set(b.x, 0.09, b.z);
      mesh.receiveShadow = true;
      scene.add(mesh);
      bumps.push(b);
    });

    // 賽道上的迷你比例零食 (葵花籽 & 小起司塊)
    const snacks = [];
    const cheeseMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.4 });
    const seedMat = new THREE.MeshStandardMaterial({ color: 0x2b2d42, roughness: 0.5 });
    const seedStripeMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.5 });

    for (let i = 0; i < 16; i++) {
      const isCheese = i % 2 === 0;
      const snackGroup = new THREE.Group();
      if (isCheese) {
        const cheese = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.11, 3), cheeseMat);
        cheese.castShadow = true;
        snackGroup.add(cheese);
      } else {
        const seed = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), seedMat);
        seed.scale.set(0.65, 0.45, 1.35);
        const stripe = new THREE.Mesh(new THREE.SphereGeometry(0.142, 10, 8), seedStripeMat);
        stripe.scale.set(0.3, 0.48, 1.32);
        snackGroup.add(seed, stripe);
      }
      snackGroup.position.set(
        (Math.random() - 0.5) * (TRACK_WIDTH - 3.0),
        0.06,
        8 + Math.random() * (FINISH_Z - 14)
      );
      snackGroup.rotation.y = Math.random() * Math.PI * 2;
      snackGroup.userData = { type: isCheese ? '起司塊' : '葵花籽', active: true };
      scene.add(snackGroup);
      snacks.push(snackGroup);
    }

    // 終點後方 3D 頒獎台 (配合大球拉開底座間距，避免三顆大球在台上重疊)
    const PODIUM_Z = FINISH_Z + 9.5;
    const podiumGroup = new THREE.Group();
    podiumGroup.position.set(0, 0, PODIUM_Z);
    scene.add(podiumGroup);
    const podiumSpecs = [
      { rank: 1, x: 0, h: 1.5, color: 0xffd700 },
      { rank: 2, x: -3.2, h: 1.05, color: 0xc0c0c0 },
      { rank: 3, x: 3.2, h: 0.75, color: 0xcd7f32 }
    ];
    podiumSpecs.forEach(p => {
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(2.8, p.h, 2.8),
        new THREE.MeshStandardMaterial({ color: p.color, metalness: 0.4, roughness: 0.3 })
      );
      box.position.set(p.x, p.h / 2, 0);
      box.castShadow = true;
      box.receiveShadow = true;
      podiumGroup.add(box);
    });

    // ================= 4. 放大版 3D 倉鼠與高透明滾球模型工廠 =================
    function createHamsterRacer(cfg, laneIndex) {
      const root = new THREE.Group();
      root.position.set(getLaneX(laneIndex), BALL_RADIUS, START_Z);

      // 外層透明球殼
      const ballGroup = new THREE.Group();
      const shellGeo = new THREE.SphereGeometry(BALL_RADIUS, 36, 28);
      const shellMat = new THREE.MeshPhysicalMaterial({
        color: cfg.ballTint,
        transparent: true,
        opacity: 0.34,
        roughness: 0.12,
        metalness: 0.05,
        depthWrite: false
      });
      const shellMesh = new THREE.Mesh(shellGeo, shellMat);
      ballGroup.add(shellMesh);

      // 赤道卡榫環 + 交叉環
      const seamRing = new THREE.Mesh(
        new THREE.TorusGeometry(BALL_RADIUS * 0.995, 0.03, 10, 40),
        new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.68 })
      );
      const crossRing = seamRing.clone();
      crossRing.rotation.y = Math.PI / 2;
      ballGroup.add(seamRing, crossRing);
      root.add(ballGroup);

      // 內部放大版 3D 倉鼠模型
      const hamsterBaseY = -BALL_RADIUS + 0.34 * HAMSTER_SCALE;
      const hamsterGroup = new THREE.Group();
      hamsterGroup.scale.setScalar(HAMSTER_SCALE);
      hamsterGroup.position.set(0, hamsterBaseY, 0);
      root.add(hamsterGroup);

      const bodyMat = new THREE.MeshStandardMaterial({ color: cfg.bodyColor, roughness: 0.75 });
      const bellyMat = new THREE.MeshStandardMaterial({ color: cfg.bellyColor, roughness: 0.8 });
      const patchMat = new THREE.MeshStandardMaterial({ color: cfg.patchColor, roughness: 0.75 });
      const pinkMat = new THREE.MeshStandardMaterial({ color: 0xff8fa3, roughness: 0.5 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

      const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 22, 18), bodyMat);
      body.scale.set(0.95, 0.9, 1.25);
      body.castShadow = true;
      hamsterGroup.add(body);

      const belly = new THREE.Mesh(new THREE.SphereGeometry(0.28, 18, 14), bellyMat);
      belly.position.set(0, -0.06, 0.04);
      belly.scale.set(0.88, 0.82, 1.15);
      hamsterGroup.add(belly);

      const backPatch = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 14), patchMat);
      backPatch.position.set(0, 0.14, -0.05);
      backPatch.scale.set(0.85, 0.65, 1.1);
      hamsterGroup.add(backPatch);

      const headGroup = new THREE.Group();
      headGroup.position.set(0, 0.14, 0.32);
      hamsterGroup.add(headGroup);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.23, 20, 18), bodyMat);
      headGroup.add(head);

      [-1, 1].forEach(side => {
        const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 14), bellyMat);
        cheek.position.set(side * 0.13, -0.04, 0.08);
        headGroup.add(cheek);

        const ear = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 14), pinkMat);
        ear.scale.set(1, 1, 0.45);
        ear.position.set(side * 0.16, 0.18, -0.03);
        headGroup.add(ear);

        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.036, 12, 12), eyeMat);
        eye.position.set(side * 0.1, 0.05, 0.19);
        headGroup.add(eye);
      });

      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.032, 12, 12), pinkMat);
      nose.position.set(0, 0.0, 0.23);
      headGroup.add(nose);

      const tail = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), bellyMat);
      tail.position.set(0, 0.02, -0.39);
      hamsterGroup.add(tail);

      const paws = [];
      [
        { x: -0.16, y: -0.22, z: 0.2 },
        { x: 0.16, y: -0.22, z: 0.2 },
        { x: -0.17, y: -0.22, z: -0.2 },
        { x: 0.17, y: -0.22, z: -0.2 }
      ].forEach(p => {
        const paw = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 12), pinkMat);
        paw.scale.set(0.9, 0.65, 1.3);
        paw.position.set(p.x, p.y, p.z);
        hamsterGroup.add(paw);
        paws.push(paw);
      });

      // 頭頂暈眩環繞小星星
      const dizzyGroup = new THREE.Group();
      dizzyGroup.position.set(0, 0.56, 0.25);
      dizzyGroup.visible = false;
      const starMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
      for (let s = 0; s < 3; s++) {
        const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.075, 0), starMat);
        const angle = (s / 3) * Math.PI * 2;
        star.position.set(Math.cos(angle) * 0.24, 0, Math.sin(angle) * 0.24);
        dizzyGroup.add(star);
      }
      hamsterGroup.add(dizzyGroup);

      // 頭頂懸浮號碼牌 Sprite (可動態更新衝線名次標記)
      const badgeCanvas = document.createElement('canvas');
      badgeCanvas.width = 160; badgeCanvas.height = 64;
      const badgeTex = new THREE.CanvasTexture(badgeCanvas);

      function updateBadgeText(label) {
        const bg = badgeCanvas.getContext('2d');
        bg.clearRect(0, 0, 160, 64);
        bg.fillStyle = 'rgba(18, 22, 33, 0.84)';
        bg.beginPath();
        bg.roundRect(10, 10, 140, 44, 22);
        bg.fill();
        bg.strokeStyle = cfg.uiColor;
        bg.lineWidth = 4;
        bg.stroke();
        bg.fillStyle = '#ffffff';
        bg.font = 'bold 24px sans-serif';
        bg.textAlign = 'center';
        bg.textBaseline = 'middle';
        bg.fillText(label, 80, 33);
        badgeTex.needsUpdate = true;
      }
      updateBadgeText(cfg.num);

      const badgeSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: badgeTex, transparent: true }));
      badgeSprite.scale.set(1.35, 0.54, 1);
      badgeSprite.position.set(0, BALL_RADIUS + 0.55, 0);
      root.add(badgeSprite);

      scene.add(root);

      return {
        cfg,
        root,
        ballGroup,
        hamsterGroup,
        hamsterBaseY,
        headGroup,
        paws,
        dizzyGroup,
        updateBadgeText,
        pos: root.position,
        vel: new THREE.Vector3(0, 0, 0),
        heading: 0,
        state: 'IDLE', // IDLE, RUN, TURBO, REVERSE, GROOM, SNACK, DIZZY, SABOTAGE
        stateTimer: 0,
        targetSnack: null,
        finishOrder: null, // 一旦衝過終點即鎖定名次，但仍留在場上亂跑干擾！
        runPhase: Math.random() * 10
      };
    }

    const racers = HAMSTER_CONFIGS.map((cfg, idx) => createHamsterRacer(cfg, idx));

    // ================= 5. 紙花慶祝粒子系統 =================
    const confettiGroup = new THREE.Group();
    scene.add(confettiGroup);
    const confettiPieces = [];
    const confettiColors = [0xff595e, 0xffca3a, 0x8ac926, 0x1982c4, 0xff9f1c, 0xffffff];
    for (let i = 0; i < 95; i++) {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(0.22, 0.12),
        new THREE.MeshBasicMaterial({ color: confettiColors[i % confettiColors.length], side: THREE.DoubleSide })
      );
      m.visible = false;
      confettiGroup.add(m);
      confettiPieces.push({
        mesh: m,
        vel: new THREE.Vector3(),
        rotVel: new THREE.Vector3()
      });
    }

    function launchConfetti() {
      confettiPieces.forEach(p => {
        p.mesh.visible = true;
        p.mesh.position.set(
          (Math.random() - 0.5) * 10,
          4.0 + Math.random() * 4.0,
          PODIUM_Z + (Math.random() - 0.5) * 5
        );
        p.vel.set((Math.random() - 0.5) * 2.8, -1.2 - Math.random() * 1.8, (Math.random() - 0.5) * 2.8);
        p.rotVel.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
      });
    }

    // ================= 6. UI 初始化與互動綁定 =================
    let gameState = 'BETTING'; // BETTING, RACING, PODIUM
    let selectedBetId = 0;
    let cameraMode = 'broadcast';
    let ribbonDropProgress = 0;
    let finishCounter = 0;
    let lastTickerTime = 0;

    const tickerTextEl = document.getElementById('ticker-text');
    function announce(msg, force = false) {
      const now = performance.now();
      if (!force && now - lastTickerTime < 1300) return;
      lastTickerTime = now;
      tickerTextEl.textContent = msg;
      tickerTextEl.style.animation = 'none';
      void tickerTextEl.offsetWidth;
      tickerTextEl.style.animation = 'pulseText 0.35s ease';
    }

    const miniTrackEl = document.getElementById('mini-track');
    const cardsContainer = document.getElementById('hamster-cards');
    const trackDots = [];

    HAMSTER_CONFIGS.forEach((cfg, idx) => {
      const dot = document.createElement('div');
      dot.className = 'track-dot';
      dot.style.background = cfg.uiColor;
      dot.style.left = '0%';
      miniTrackEl.appendChild(dot);
      trackDots.push(dot);

      const card = document.createElement('div');
      card.className = 'h-card' + (idx === 0 ? ' selected' : '');
      card.innerHTML = `
        <div class="h-swatch" style="background:${cfg.uiColor}"></div>
        <div class="h-name">${cfg.num} ${cfg.name}</div>
        <div class="h-trait">${cfg.trait}</div>
      `;
      card.addEventListener('click', () => {
        selectedBetId = idx;
        document.querySelectorAll('.h-card').forEach((el, i) => el.classList.toggle('selected', i === idx));
        document.getElementById('selected-label').textContent = `已押注：${cfg.num} ${cfg.name}`;
        SoundFX.nibble();
      });
      cardsContainer.appendChild(card);
    });

    document.querySelectorAll('.cam-btn[data-cam]').forEach(btn => {
      btn.addEventListener('click', () => {
        cameraMode = btn.dataset.cam;
        document.querySelectorAll('.cam-btn[data-cam]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    const muteBtn = document.getElementById('mute-btn');
    muteBtn.addEventListener('click', () => {
      const isMuted = SoundFX.toggleMute();
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      if (gameState !== 'BETTING') return;
      gameState = 'RACING';
      ribbonDropProgress = 0.01;
      finishCounter = 0;
      document.getElementById('bet-panel').classList.add('hidden');
      SoundFX.startHorn();
      announce('✂️ 紅絲帶落地！五顆巨無霸倉鼠球擠在一起瘋狂開跑！！', true);

      racers.forEach(r => {
        r.state = 'RUN';
        r.stateTimer = 0.9 + Math.random() * 1.4;
        r.vel.z = 3.6 + Math.random() * 2.2;
      });
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      gameState = 'BETTING';
      ribbonDropProgress = 0;
      finishCounter = 0;
      document.getElementById('podium-overlay').style.display = 'none';
      document.getElementById('bet-panel').classList.remove('hidden');

      const posAttr = ribbonGeo.attributes.position;
      for (let i = 0; i < posAttr.array.length; i++) posAttr.array[i] = ribbonOrigPos[i];
      posAttr.needsUpdate = true;
      ribbonMesh.position.set(0, 1.25, RIBBON_Z);

      snacks.forEach(s => {
        s.visible = true;
        s.userData.active = true;
        s.position.set(
          (Math.random() - 0.5) * (TRACK_WIDTH - 3.0),
          0.06,
          8 + Math.random() * (FINISH_Z - 14)
        );
      });

      confettiPieces.forEach(p => { p.mesh.visible = false; });

      racers.forEach((r, idx) => {
        r.pos.set(getLaneX(idx), BALL_RADIUS, START_Z);
        r.vel.set(0, 0, 0);
        r.heading = 0;
        r.state = 'IDLE';
        r.finishOrder = null;
        r.dizzyGroup.visible = false;
        r.hamsterGroup.position.y = r.hamsterBaseY;
        r.hamsterGroup.rotation.set(0, 0, 0);
        r.updateBadgeText(r.cfg.num);
      });

      announce('🎙️ 新一輪賽前押注開始！請選擇你支持的冠軍倉鼠！', true);
    });

    // ================= 7. 高混亂 AI (含過線後回頭干擾) 與物理更新 =================
    function pickNextChaosState(r) {
      // 【新機制】已經衝過終點線的倉鼠：不會乖乖停下，而是有極高機率掉頭回賽道干擾其他選手！
      if (r.finishOrder !== null) {
        const unFinished = racers.filter(o => o.finishOrder === null);
        if (unFinished.length > 0 && Math.random() < 0.72) {
          r.state = 'SABOTAGE';
          r.stateTimer = 1.6 + Math.random() * 1.4;
          announce(`😈 已完賽的 ${r.cfg.num}${r.cfg.name} 竟然掉頭衝回終點線前干擾對手！`);
          return;
        } else {
          r.state = 'GROOM';
          r.stateTimer = 1.2;
          return;
        }
      }

      const roll = Math.random();
      if (roll < 0.28) {
        r.state = 'RUN';
        r.stateTimer = 1.4 + Math.random() * 1.6;
      } else if (roll < 0.48) {
        r.state = 'TURBO';
        r.stateTimer = 1.1 + Math.random() * 1.1;
        announce(`🔥 ${r.cfg.num}${r.cfg.name} 耳朵貼平開啟超級暴衝！`);
      } else if (roll < 0.65) {
        r.state = 'REVERSE';
        r.stateTimer = 1.0 + Math.random() * 1.1;
        announce(`❓ 喂！${r.cfg.num}${r.cfg.name} 迷航大迴轉往起點跑了！`);
      } else if (roll < 0.82) {
        r.state = 'GROOM';
        r.stateTimer = 1.3 + Math.random() * 1.2;
        announce(`💤 ${r.cfg.num}${r.cfg.name} 停在路中央發呆洗臉變成大路障！`);
      } else {
        let nearest = null;
        let minDist = 11.5;
        snacks.forEach(s => {
          if (!s.userData.active) return;
          const d = r.pos.distanceTo(s.position);
          if (d < minDist) {
            minDist = d;
            nearest = s;
          }
        });
        if (nearest) {
          r.state = 'SNACK';
          r.targetSnack = nearest;
          r.stateTimer = 2.2;
        } else {
          r.state = 'ZIGZAG';
          r.stateTimer = 1.5 + Math.random();
        }
      }
    }

    const rollAxis = new THREE.Vector3();
    const rollQuat = new THREE.Quaternion();

    function updateSimulation(dt) {
      const time = performance.now() * 0.001;

      if (scene.userData.fans) {
        const cheerAmp = gameState === 'RACING' ? 0.14 : (gameState === 'PODIUM' ? 0.26 : 0.04);
        scene.userData.fans.forEach(fan => {
          fan.position.y = fan.userData.baseY + Math.abs(Math.sin(time * 6 + fan.userData.phase)) * cheerAmp;
        });
      }

      // 紅絲帶垂落動畫
      if (ribbonDropProgress > 0 && ribbonDropProgress < 1) {
        ribbonDropProgress = Math.min(1, ribbonDropProgress + dt * 2.4);
        const posAttr = ribbonGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
          const ox = ribbonOrigPos[i * 3];
          const oy = ribbonOrigPos[i * 3 + 1];
          const normX = ox / (TRACK_WIDTH / 2);
          const sag = Math.cos(normX * Math.PI * 0.5);
          const dropY = -1.2 * ribbonDropProgress * (0.35 + 0.65 * sag);
          const curlZ = 0.42 * ribbonDropProgress * sag * Math.sin(normX * 4);
          posAttr.setY(i, oy + dropY);
          posAttr.setZ(i, curlZ);
        }
        posAttr.needsUpdate = true;
      }

      if (gameState === 'RACING') {
        racers.forEach(r => {
          r.stateTimer -= dt;
          if (r.stateTimer <= 0) {
            r.dizzyGroup.visible = false;
            pickNextChaosState(r);
          }

          let desiredVx = 0;
          let desiredVz = 0;
          let targetHeading = 0;

          if (r.state === 'RUN') {
            desiredVz = 4.8;
            desiredVx = Math.sin(time * 2.5 + r.cfg.id * 2) * 1.5;
            targetHeading = Math.atan2(desiredVx, desiredVz);
          } else if (r.state === 'TURBO') {
            desiredVz = 8.6;
            desiredVx = Math.cos(time * 4 + r.cfg.id) * 2.3;
            targetHeading = Math.atan2(desiredVx, desiredVz);
          } else if (r.state === 'REVERSE') {
            desiredVz = -4.4;
            desiredVx = Math.sin(time * 3 + r.cfg.id) * 1.9;
            targetHeading = Math.atan2(desiredVx, desiredVz);
          } else if (r.state === 'ZIGZAG') {
            desiredVz = 4.0;
            desiredVx = Math.sin(time * 6.5 + r.cfg.id * 1.7) * 5.4;
            targetHeading = Math.atan2(desiredVx, desiredVz);
          } else if (r.state === 'GROOM') {
            desiredVx = 0;
            desiredVz = 0;
          } else if (r.state === 'SABOTAGE') {
            // 已完賽倉鼠鎖定最接近終點線的未完賽對手，回頭迎面撞擊或橫向擋路！
            const unFinished = racers.filter(o => o.finishOrder === null);
            if (unFinished.length > 0) {
              const target = unFinished.reduce((best, o) => (o.pos.z > best.pos.z ? o : best), unFinished[0]);
              const dx = target.pos.x - r.pos.x;
              const dz = target.pos.z - r.pos.z;
              const dist = Math.max(0.1, Math.hypot(dx, dz));
              desiredVx = (dx / dist) * 6.4;
              desiredVz = (dz / dist) * 6.4;
              targetHeading = Math.atan2(desiredVx, desiredVz);
            } else {
              desiredVz = -3.0;
              targetHeading = Math.PI;
            }
          } else if (r.state === 'SNACK' && r.targetSnack && r.targetSnack.userData.active) {
            const dx = r.targetSnack.position.x - r.pos.x;
            const dz = r.targetSnack.position.z - r.pos.z;
            const dist = Math.hypot(dx, dz);
            if (dist < 0.42) {
              r.targetSnack.userData.active = false;
              r.targetSnack.visible = false;
              r.vel.y = 3.6;
              r.state = 'TURBO';
              r.stateTimer = 1.4;
              SoundFX.nibble();
              announce(`😋 ${r.cfg.num}${r.cfg.name} 啃掉${r.targetSnack.userData.type}精力充沛！`);
            } else {
              desiredVx = (dx / dist) * 5.4;
              desiredVz = (dz / dist) * 5.4;
              targetHeading = Math.atan2(desiredVx, desiredVz);
            }
          } else if (r.state === 'DIZZY') {
            r.dizzyGroup.visible = true;
            r.dizzyGroup.rotation.y += dt * 9;
            r.heading += dt * 11;
          }

          if (r.state !== 'DIZZY') {
            const accel = r.state === 'GROOM' ? 5.0 : 3.4;
            r.vel.x += (desiredVx - r.vel.x) * Math.min(1, dt * accel);
            r.vel.z += (desiredVz - r.vel.z) * Math.min(1, dt * accel);

            let diff = targetHeading - r.heading;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            r.heading += diff * Math.min(1, dt * 7);
          } else {
            r.vel.x *= 0.96;
            r.vel.z *= 0.96;
          }

          // 重力與地板彈跳
          r.vel.y -= 16.0 * dt;
          r.pos.x += r.vel.x * dt;
          r.pos.y += r.vel.y * dt;
          r.pos.z += r.vel.z * dt;

          if (r.pos.y <= BALL_RADIUS) {
            r.pos.y = BALL_RADIUS;
            if (r.vel.y < -1.5) {
              r.vel.y = -r.vel.y * 0.35;
            } else {
              r.vel.y = 0;
            }
          }

          // 賽道邊界護欄與前後端牆阻擋 (確保過線倉鼠不會跑出舞台外)
          const maxX = TRACK_WIDTH / 2 - BALL_RADIUS - 0.04;
          if (r.pos.x < -maxX) {
            r.pos.x = -maxX;
            r.vel.x = Math.abs(r.vel.x) * 0.85;
            SoundFX.bump();
          } else if (r.pos.x > maxX) {
            r.pos.x = maxX;
            r.vel.x = -Math.abs(r.vel.x) * 0.85;
            SoundFX.bump();
          }
          if (r.pos.z < -2.6) {
            r.pos.z = -2.6;
            r.vel.z = Math.abs(r.vel.z) * 0.8;
          }
          const maxZ = FINISH_Z + 5.5;
          if (r.pos.z > maxZ) {
            r.pos.z = maxZ;
            r.vel.z = -Math.abs(r.vel.z) * 0.85;
          }

          // 木頭減速彈跳條檢測
          bumps.forEach(b => {
            if (Math.abs(r.pos.z - b.z) < 0.45 && Math.abs(r.pos.x - b.x) < b.w / 2 + 0.4) {
              if (r.pos.y <= BALL_RADIUS + 0.1) {
                r.vel.y = 4.0;
                r.vel.z *= 0.72;
                SoundFX.bump();
              }
            }
          });

          // 零打滑透明球體四元數滾動
          const speed2D = Math.hypot(r.vel.x, r.vel.z);
          if (speed2D > 0.05) {
            const distMoved = speed2D * dt;
            const angle = distMoved / BALL_RADIUS;
            rollAxis.set(r.vel.z, 0, -r.vel.x).normalize();
            rollQuat.setFromAxisAngle(rollAxis, angle);
            r.ballGroup.quaternion.premultiply(rollQuat);
          }

          // 倉鼠身體與四肢動畫
          r.hamsterGroup.rotation.y = r.heading;
          if (r.state === 'GROOM') {
            r.hamsterGroup.rotation.x = -0.35;
            r.paws[0].position.set(-0.08, 0.06, 0.36 + Math.sin(time * 22) * 0.04);
            r.paws[1].position.set(0.08, 0.06, 0.36 - Math.sin(time * 22) * 0.04);
          } else {
            r.hamsterGroup.rotation.x = Math.min(0.28, speed2D * 0.035);
            r.runPhase += speed2D * dt * 4.2;
            r.paws[0].position.set(-0.16, -0.22 + Math.max(0, Math.sin(r.runPhase)) * 0.07, 0.2 + Math.cos(r.runPhase) * 0.08);
            r.paws[3].position.set(0.17, -0.22 + Math.max(0, Math.sin(r.runPhase)) * 0.07, -0.2 + Math.cos(r.runPhase) * 0.08);
            r.paws[1].position.set(0.16, -0.22 + Math.max(0, -Math.sin(r.runPhase)) * 0.07, 0.2 - Math.cos(r.runPhase) * 0.08);
            r.paws[2].position.set(-0.17, -0.22 + Math.max(0, -Math.sin(r.runPhase)) * 0.07, -0.2 - Math.cos(r.runPhase) * 0.08);
          }

          // 首次衝過終點線判定 (紀錄名次但保持物理與回頭干擾能力！)
          if (r.pos.z >= FINISH_Z && r.finishOrder === null) {
            finishCounter++;
            r.finishOrder = finishCounter;
            const medals = ['🥇1st', '🥈2nd', '🥉3rd'];
            r.updateBadgeText(`${medals[finishCounter - 1] || ''} ${r.cfg.num}`);
            SoundFX.nibble();
            announce(`🏁 第 ${finishCounter} 名衝線：${r.cfg.num} ${r.cfg.name}！`, true);

            if (finishCounter >= 3) {
              enterPodiumPhase();
            } else {
              // 衝線後立刻觸發回頭干擾狀態
              r.state = 'SABOTAGE';
              r.stateTimer = 2.0;
            }
          }
        });

        // 球體間高彈性碰撞 (包含已過終點回頭的倉鼠與未完賽倉鼠之間的衝撞！)
        const minDist = BALL_RADIUS * 2;
        for (let i = 0; i < racers.length; i++) {
          for (let j = i + 1; j < racers.length; j++) {
            const a = racers[i];
            const b = racers[j];

            const dx = b.pos.x - a.pos.x;
            const dz = b.pos.z - a.pos.z;
            const dist = Math.hypot(dx, dz);

            if (dist > 0.001 && dist < minDist) {
              const nx = dx / dist;
              const nz = dz / dist;
              const overlap = (minDist - dist) * 0.52;
              a.pos.x -= nx * overlap;
              a.pos.z -= nz * overlap;
              b.pos.x += nx * overlap;
              b.pos.z += nz * overlap;

              const relVx = b.vel.x - a.vel.x;
              const relVz = b.vel.z - a.vel.z;
              const impactSpeed = -(relVx * nx + relVz * nz);

              if (impactSpeed > 0) {
                const impulse = impactSpeed * 1.28;
                a.vel.x -= nx * impulse;
                a.vel.z -= nz * impulse;
                b.vel.x += nx * impulse;
                b.vel.z += nz * impulse;

                if (impactSpeed > 3.0) {
                  const victim = Math.random() < 0.5 ? a : b;
                  victim.vel.y = 4.4;
                  victim.state = 'DIZZY';
                  victim.stateTimer = 1.25;
                  SoundFX.dizzy();
                  if (a.finishOrder !== null || b.finishOrder !== null) {
                    announce(`🚨 惡意阻擋！已完賽的選手回頭把 ${victim.cfg.num}${victim.cfg.name} 撞到眼冒金星！`);
                  } else {
                    announce(`💥 碰！${a.cfg.num}與${b.cfg.num}巨球對撞，${victim.cfg.name}眼冒金星！`);
                  }
                } else {
                  SoundFX.bump();
                }
              }
            }
          }
        }
      }

      // 更新頂部 6px 迷你進度條圓點
      racers.forEach((r, idx) => {
        const pct = Math.max(0, Math.min(100, ((r.pos.z - START_Z) / (FINISH_Z - START_Z)) * 100));
        trackDots[idx].style.left = `${pct}%`;
      });

      // 頒獎台階段動畫
      if (gameState === 'PODIUM') {
        racers.forEach(r => {
          if (r.finishOrder && r.finishOrder <= 3) {
            r.hamsterGroup.position.y = r.hamsterBaseY + Math.abs(Math.sin(time * 7 + r.finishOrder)) * 0.22;
            r.hamsterGroup.rotation.y = Math.PI + Math.sin(time * 3 + r.finishOrder) * 0.25;
          }
        });
        confettiPieces.forEach(p => {
          if (!p.mesh.visible) return;
          p.mesh.position.addScaledVector(p.vel, dt);
          p.mesh.rotation.x += p.rotVel.x * dt;
          p.mesh.rotation.y += p.rotVel.y * dt;
          if (p.mesh.position.y < 0.1) p.mesh.position.y = 6.2;
        });
      }
    }

    function enterPodiumPhase() {
      gameState = 'PODIUM';
      SoundFX.fanfare();
      launchConfetti();

      const sorted = [...racers].sort((a, b) => {
        if (a.finishOrder && b.finishOrder) return a.finishOrder - b.finishOrder;
        if (a.finishOrder) return -1;
        if (b.finishOrder) return 1;
        return b.pos.z - a.pos.z;
      });

      sorted.forEach((r, idx) => { r.finishOrder = idx + 1; });

      const top3 = sorted.slice(0, 3);
      top3.forEach((r, idx) => {
        const spec = podiumSpecs[idx];
        r.pos.set(spec.x, spec.h + BALL_RADIUS, PODIUM_Z);
        r.vel.set(0, 0, 0);
        r.dizzyGroup.visible = false;
      });

      const champion = top3[0];
      const won = champion.cfg.id === selectedBetId;
      document.getElementById('bet-result').innerHTML = won
        ? `🎊 太神啦！你押注的 <span style="color:#06d6a0">${champion.cfg.num} ${champion.cfg.name}</span> 勇奪第一名！`
        : `😅 可惜！冠軍是 <span style="color:#ffd166">${champion.cfg.num} ${champion.cfg.name}</span>，下次再接再厲！`;

      document.getElementById('podium-list').innerHTML = top3.map((r, i) => {
        const medals = ['🥇 冠軍', '🥈 亞軍', '🥉 季軍'];
        return `<div class="podium-badge">${medals[i]}<br><strong>${r.cfg.num} ${r.cfg.name}</strong></div>`;
      }).join('');

      document.getElementById('podium-overlay').style.display = 'block';
      announce(`🏆 冠軍出爐：${champion.cfg.num} ${champion.cfg.name} 登上頒獎台接受喝采！`, true);
    }

    // ================= 8. 多視角攝影機跟隨與主迴圈 =================
    const camTargetPos = new THREE.Vector3();
    const camLookAt = new THREE.Vector3();

    function updateCamera(dt) {
      const time = performance.now() * 0.001;

      if (gameState === 'BETTING') {
        camTargetPos.set(Math.sin(time * 0.4) * 3.8, 5.4, -8.8);
        camLookAt.set(0, 1.2, 3.5);
      } else if (gameState === 'PODIUM') {
        camTargetPos.set(Math.sin(time * 0.5) * 2.8, 5.0, PODIUM_Z - 9.2);
        camLookAt.set(0, 2.2, PODIUM_Z);
      } else {
        // 轉播焦點鎖定「尚未衝線的領先者」，這樣能清楚看到已過線倉鼠回頭干擾搶前三名的精彩畫面！
        const activeRacers = racers.filter(r => r.finishOrder === null);
        const focusPool = activeRacers.length > 0 ? activeRacers : racers;
        const leader = focusPool.reduce((best, r) => (r.pos.z > best.pos.z ? r : best), focusPool[0]);
        const hero = racers[selectedBetId];

        if (cameraMode === 'hero') {
          camTargetPos.set(hero.pos.x * 0.75, 4.8, hero.pos.z - 7.8);
          camLookAt.set(hero.pos.x, 1.1, hero.pos.z + 5.5);
        } else if (cameraMode === 'aerial') {
          const avgZ = racers.reduce((sum, r) => sum + r.pos.z, 0) / racers.length;
          camTargetPos.set(0, 19.5, avgZ - 10.5);
          camLookAt.set(0, 0.8, avgZ + 6.0);
        } else {
          camTargetPos.set(Math.sin(time * 0.45) * 4.5, 6.2, leader.pos.z - 9.2);
          camLookAt.set(leader.pos.x * 0.4, 1.1, leader.pos.z + 4.5);
        }
      }

      camera.position.lerp(camTargetPos, Math.min(1, dt * 4.2));
      camera.lookAt(camLookAt);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let prevTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - prevTime) / 1000);
      prevTime = now;

      updateSimulation(dt);
      updateCamera(dt);
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
